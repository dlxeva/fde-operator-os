name: Validate FDE Operator OS

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate artifact contract and links
        run: python tools/validate_repo.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
